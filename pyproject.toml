[project]
name = "client-finder"
version = "1.0.0"
description = "LLM-powered automated client finder and outreach tool that runs locally on your device"
requires-python = ">=3.11"
authors = [{ name = "client-finder user" }]
dependencies = [
    "litellm>=1.3.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "fastmcp>=0.1.0",
    "playwright>=1.45.0",
    "beautifulsoup4>=4.12.0",
    "curl_cffi>=0.6.0",
    "requests>=2.31.0",
    "lxml>=5.2.0",
    "email-validator>=2.1.0",
    "aiosmtplib>=3.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
client-finder = "client_finder.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["client_finder*", "mcp*", "opencode*"]