# Target industries, locations, and do-not-contact rules
# These are used by the LLM to score and filter leads

target:
  industries:
    - healthcare
    - logistics
    - professional services
    - local retail
    - real estate
  company_size: "1-50 employees"
  locations:
    - United States
    - Canada
    - United Kingdom

do_not_contact_domains:
  - google.com
  - facebook.com
  - microsoft.com
  - amazon.com

do_not_contact_keywords:
  - recruiting agency
  - lead generation
  - outsourcing